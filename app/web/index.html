<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="WeOwnFeed (WOF): We don't follow blogs. We follow topics. Own your personal feed with receipts.">
  <meta name="theme-color" content="#111110">
  <!-- The app is already dark: keep the browser's automatic dark mode and
       extensions like Dark Reader off the page. -->
  <meta name="color-scheme" content="dark">
  <meta name="darkreader-lock">
  <style>
    /* Flutter draws text on a canvas and keeps a hidden <input>/<textarea>
       underneath for keyboard input. If extensions color that box, the text
       is drawn twice on top of itself. Keep the box invisible at all times. */
    flt-text-editing-host input,
    flt-text-editing-host textarea,
    .flt-text-editing {
      color: transparent !important;
      -webkit-text-fill-color: transparent !important;
      background: transparent !important;
      caret-color: transparent !important;
      text-shadow: none !important;
    }
  </style>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="WeOwnFeed">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>WeOwnFeed</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="background-color: #111110; margin: 0;">
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
